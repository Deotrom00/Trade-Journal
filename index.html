muted{color:var(--muted)}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(5,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px;min-width:0}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:23px;font-weight:750;margin-top:8px;white-space:nowrap}.positive{color:var(--green)!important}.negative{color:var(--red)!important}.neutral{color:#d6d8dc}.two{grid-template-columns:1.2fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.chart-wrap{height:230px;position:relative}.chart-wrap canvas{width:100%;height:100%}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dayname{text-align:center;color:var(--muted);font-size:11px;padding:4px}.calday{height:65px;border:1px solid var(--line);border-radius:7px;background:#1a1c20;padding:7px;font-size:11px;display:flex;flex-direction:column;justify-content:space-between}.calday.win{background:rgba(67,197,138,.17);border-color:rgba(67,197,138,.35)}.calday.loss{background:rgba(240,108,112,.16);border-color:rgba(240,108,112,.35)}.calday.dim{opacity:.25}.calday b{font-size:12px}.month-nav{display:flex;align-items:center;gap:10px}.month-nav button,.icon-btn{background:#24272c;border:1px solid var(--line);color:#ddd;border-radius:7px;padding:6px 9px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}th{color:var(--muted);font-weight:600}tr:last-child td{border-bottom:0}.tag{display:inline-block;border-radius:20px;padding:3px 8px;font-size:11px;background:#292c31;color:#d8dbe0}.tag.win{background:rgba(67,197,138,.14);color:var(--green)}.tag.loss{background:rgba(240,108,112,.14);color:var(--red)}.btn{border:1px solid var(--line);background:#24272c;color:#eee;border-radius:8px;padding:9px 13px}.btn.primary{background:#fff;color:#111;border-color:#fff;font-weight:700}.btn.danger{color:#ff9295}.btn.small{padding:5px 8px;font-size:11px}.actions{display:flex;gap:7px;align-items:center}.list{display:grid;gap:9px}.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}.item-head{display:flex;justify-content:space-between;gap:14px;align-items:center}.item-title{font-weight:700}.item-meta{font-size:12px;color:var(--muted);margin-top:4px}.item-body{border-top:1px solid var(--line);margin-top:13px;padding-top:13px;color:#c8cbd0;white-space:pre-wrap}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.filter{background:transparent;color:#aeb3ba;border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-size:12px}.filter.active{background:#eee;color:#111;border-color:#eee}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.progress{height:7px;background:#30343a;border-radius:8px;overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;background:#d7dadd}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#aeb3ba}.field input,.field select,.field textarea{width:100%;background:#101215;border:1px solid var(--line);border-radius:7px;color:#f1f2f4;padding:10px;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#858b94}.checklist{display:grid;gap:7px}.checkline{display:flex;align-items:center;gap:8px;color:#c8cbd0;font-size:12px}.checkline input{accent-color:#fff}.drawer-shade{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(520px,96vw);background:#17191d;border-left:1px solid var(--line);z-index:11;transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-20px 0 60px #0006}.drawer.wide{width:min(1000px,98vw)}.drawer.open{transform:translateX(0)}.drawer-shade.open{opacity:1;pointer-events:auto}.drawer-head{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.drawer-head h2{font-size:17px;margin:0}.drawer-content{padding:20px 22px;overflow:auto;flex:1}.drawer-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.subhead{font-size:12px;color:#fff;font-weight:700;margin:17px 0 9px}.image-thumb{max-width:240px;max-height:150px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:pointer;margin-top:8px}.lightbox{position:fixed;inset:0;background:#000;z-index:30;display:none;align-items:center;justify-content:center;padding:30px}.lightbox.open{display:flex}.lightbox img{max-width:96vw;max-height:92vh;object-fit:contain}.lightbox button{position:absolute;top:18px;right:22px;background:#222;color:#fff;border:1px solid #555;border-radius:8px;padding:9px 13px}.notice{color:#9ca2aa;font-size:12px;line-height:1.6}.inline-input{background:#101215;border:1px solid var(--line);color:#eee;border-radius:7px;padding:8px}.split{display:flex;justify-content:space-between;gap:12px;align-items:center}.hidden{display:none!important}
@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.main{padding:20px}.drawer.wide{width:min(850px,98vw)}}

<div class="app">
<aside class="sidebar" id="sidebar"><div class="brand">TRADE<span>LOG</span></div><nav class="nav" id="nav">

<script>
const KEY='tradelog_workspace_v1';
const defaults={account:'Account name',trades:[],plans:[],reflections:[],study:[],goals:[],models:['Breakout','Pullback','Liquidity Sweep'],risk:['Risk defined before entry','Stop loss placed correctly','Position size within risk limit','No revenge trading'],check:['Higher-timeframe bias confirmed','Entry model present','Liquidity identified','Risk/reward acceptable','No high-impact news conflict']};
let db=load(),tab='Dashboard',drawerSave=null,calDate=new Date(),filters={study:'All',reflection:'All',goalPeriod:'All',goalStatus:'Active'};
let supabase=null,cloudReady=false,readOnly=false,workspaceId=null,shareToken=null,cloudTimer=null,cloudSaving=false,cloudPending=false;
function load(){try{return {...structuredClone(defaults),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(defaults)}}
function localPersist(){localStorage.setItem(KEY,JSON.stringify(db));}
function persist(){localPersist();if(cloudReady&&!readOnly)scheduleCloudSave();}
function hasLocalEntries(x){return ['trades','plans','reflections','study','goals'].some(k=>(x[k]||[]).length>0)}
function isConfigured(){return SUPABASE_URL.startsWith('https://')&&SUPABASE_ANON_KEY.length>20&&!SUPABASE_ANON_KEY.includes('YOUR_')}
async function initializeCloud(){
  if(!isConfigured()){status('Cloud not configured. Add your Supabase URL and publishable key in index.html, then deploy. Local browser storage remains active.');return}
  try{
    supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    const params=new URLSearchParams(location.search);const publicToken=params.get('share');
    if(publicToken){
      const {data,error}=await supabase.rpc('get_shared_workspace',{p_token:publicToken});
      if(error)throw error;if(!data)throw new Error('This shared journal link is invalid or no longer available.');
      db={...structuredClone(defaults),...data};readOnly=true;document.body.classList.add('readonly');document.getElementById('accountName').disabled=true;localPersist();
      status('Viewing a shared TradeLog journal · Read-only access.','ok');render();return;
    }
    const {data:authData,error:authError}=await supabase.auth.getSession();if(authError)throw authError;
    let user=authData.session?.user;
    if(!user){const {data,error}=await supabase.auth.signInAnonymously();if(error)throw error;user=data.user;}
    if(!user)throw new Error('Could not create an anonymous session.');
    const {data:existing,error:fetchError}=await supabase.from('tradelog_workspaces').select('id,share_token,data').eq('owner_id',user.id).maybeSingle();if(fetchError)throw fetchError;
    if(existing){workspaceId=existing.id;shareToken=existing.share_token;db={...structuredClone(defaults),...(existing.data||{})};localPersist();}
    else{
      const localData=load();db={...structuredClone(defaults),...localData};
      await uploadImages(db);
      const {data:created,error:createError}=await supabase.from('tradelog_workspaces').insert({owner_id:user.id,data:db}).select('id,share_token').single();if(createError)throw createError;workspaceId=created.id;shareToken=created.share_token;
    }
    cloudReady=true;status('Cloud connected · Your journal is syncing automatically.','ok');scheduleCloudSave();render();
  }catch(e){console.error(e);status('Cloud connection error: '+(e.message||e)+' · Your local browser copy is still available.','error');}
}
function scheduleCloudSave(){clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudSave,650)}
async function cloudSave(){if(!cloudReady||readOnly||!workspaceId)return;if(cloudSaving){cloudPending=true;return}cloudSaving=true;try{const payload=structuredClone(db);await uploadImages(payload);const {error}=await supabase.from('tradelog_workspaces').update({data:payload,updated_at:new Date().toISOString()}).eq('id',workspaceId);if(error)throw error;status('Cloud connected · All changes saved.','ok')}catch(e){console.error(e);status('Cloud save failed: '+(e.message||e)+'. Your changes remain in this browser; retry or export a backup.','error')}finally{cloudSaving=false;if(cloudPending){cloudPending=false;scheduleCloudSave()}}}
async function uploadImages(payload){const collections=['trades','plans','study'];for(const key of collections){for(const item of (payload[key]||[])){for(const field of ['image','dailyImage','intradayImage']){const src=item[field];if(typeof src==='string'&&src.startsWith('data:image/')){const match=src.match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,(.+)$/);if(!match)continue;const ext=match[1].split('/')[1].replace('jpeg','jpg');const path=`${(await supabase.auth.getUser()).data.user.id}/${key}/${item.id}-${field}.${ext}`;const bytes=Uint8Array.from(atob(match[2]),c=>c.charCodeAt(0));const {error}=await supabase.storage.from('tradelog-images').upload(path,bytes,{contentType:match[1],upsert:true});if(error)throw error;item[field]=supabase.storage.from('tradelog-images').getPublicUrl(path).data.publicUrl;}}}}}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return (Number(n)||0).toLocaleString(undefined,{style:'currency',currency:'USD',maximumFractionDigits:2})}
function dateNow(){return new Date().toISOString().slice(0,10)}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function sum(a){return a.reduce((x,y)=>x+(Number(y.pnl)||0),0)}
function openDrawer(title,wide,html,onSave){if(readOnly)return;document.getElementById('drawerTitle').textContent=title;document.getElementById('drawerContent').innerHTML=html;document.getElementById('drawer').classList.toggle('wide',!!wide);document.getElementById('drawer').classList.add('open');document.getElementById('shade').classList.add('open');drawerSave=onSave}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('shade').classList.remove('open');drawerSave=null}
document.getElementById('closeDrawer').onclick=document.getElementById('cancelDrawer').onclick=closeDrawer;document.getElementById('shade').onclick=closeDrawer;document.getElementById('saveDrawer').onclick=()=>{if(drawerSave&&drawerSave()!==false){persist();closeDrawer();render()}};
function val(id){return document.getElementById(id)?.value??''}
function checkedList(name,items,selected=[]){return `<div class="checklist">${items.map((x,i)=>`<label class="checkline"><input type="checkbox" name="${name}" value="${esc(x)}" ${selected.includes(x)?'checked':''}> ${esc(x)}</label>`).join('')||'<span class="muted">Add criteria in System.</span>'}</div>`}
function selectedChecks(name){return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(x=>x.value)}
function field(label,id,value='',type='text',full=false,extra=''){return `<div class="field ${full?'full':''}"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function area(label,id,value='',full=true){return `<div class="field ${full?'full':''}"><label for="${id}">${label}</label><textarea id="${id}">${esc(value)}</textarea></div>`}
function selectField(label,id,opts,value='',full=false){return `<div class="field ${full?'full':''}"><label for="${id}">${label}</label><select id="${id}">${opts.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}
function fileField(label,id){return `<div class="field full"><label>${label}</label><input id="${id}" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><div id="${id}Preview"></div></div>`}
function readImage(id,existing,cb){const f=document.getElementById(id)?.files?.[0];if(!f){cb(existing||'');return}const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}
function imageHtml(src){return src?`<img class="image-thumb" src="${src}" onclick="showImage(this.src)" alt="Screenshot">`:''}
window.showImage=src=>{document.getElementById('lightboxImg').src=src;document.getElementById('lightbox').classList.add('open')};
document.getElementById('closeLightbox').onclick=()=>document.getElementById('lightbox').classList.remove('open');
document.getElementById('accountName').onchange=e=>{if(readOnly)return;db.account=e.target.value||'Account name';persist()};
document.getElementById('toggleSide').onclick=()=>document.getElementById('sidebar').classList.toggle('collapsed');
document.getElementById('nav').onclick=e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render()};
function headerAction(label,fn){return `<button class="btn primary" onclick="${fn}">+ ${label}</button>`}
function empty(msg){return `<div class="empty">${msg}</div>`}
function chartLine(canvasId,values){const c=document.getElementById(canvasId);if(!c)return;const ctx=c.getContext('2d'),w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);const W=c.clientWidth,H=c.clientHeight;ctx.strokeStyle='#34383e';ctx.lineWidth=1;for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(0,H*i/4);ctx.lineTo(W,H*i/4);ctx.stroke()}if(!values.length)return;let min=Math.min(0,...values),max=Math.max(1,...values),range=max-min||1;ctx.beginPath();values.forEach((v,i)=>{let x=values.length===1?W/2:i/(values.length-1)*W,y=H-((v-min)/range)*(H-20)-10;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle='#ddd';ctx.lineWidth=2;ctx.stroke()}
function chartPie(canvasId,wins,losses,be){const c=document.getElementById(canvasId);if(!c)return;const ctx=c.getContext('2d'),d=devicePixelRatio,W=c.clientWidth,H=c.clientHeight;c.width=W*d;c.height=H*d;ctx.scale(d,d);let total=wins+losses+be||1,start=-Math.PI/2;[[wins,'#43c58a'],[losses,'#f06c70'],[be,'#777d86']].forEach(([v,col])=>{let a=v/total*Math.PI*2;ctx.beginPath();ctx.moveTo(W/2,H/2);ctx.arc(W/2,H/2,Math.min(W,H)*.39,start,start+a);ctx.closePath();ctx.fillStyle=col;ctx.fill();start+=a})}
function dashboard(){const t=db.trades,ws=t.filter(x=>x.result==='Win'),ls=t.filter(x=>x.result==='Loss'),bes=t.filter(x=>x.result==='BE'),net=sum(t),grossWin=sum(ws),grossLoss=Math.abs(sum(ls)),daily={};t.forEach(x=>{daily[x.date]=(daily[x.date]||0)+(Number(x.pnl)||0)});const dayVals=Object.values(daily),winDays=dayVals.filter(x=>x>0).length,lossDays=dayVals.filter(x=>x<0).length,streak=(()=>{let s=0,last=t.slice().sort((a,b)=>(a.date+a.entryTime).localeCompare(b.date+b.entryTime)).at(-1)?.result;if(!last)return '—';for(let x of [...t].sort((a,b)=>(b.date+b.entryTime).localeCompare(a.date+a.entryTime))){if(x.result!==last)break;s++}return `${s} ${last}`})();let eq=0,curve=t.slice().sort((a,b)=>(a.date+a.entryTime).localeCompare(b.date+b.entryTime)).map(x=>eq+=Number(x.pnl)||0);let rr=t.filter(x=>Number(x.risk)>0).map(x=>Math.abs((Number(x.pnl)||0)/Number(x.risk)));let avgR=rr.length?rr.reduce((a,b)=>a+b,0)/rr.length:0;const pf=grossLoss?grossWin/grossLoss:grossWin?Infinity:0;let best=t.length?Math.max(...t.map(x=>Number(x.pnl)||0)):0;let avgW=ws.length?grossWin/ws.length:0,avgL=ls.length?sum(ls)/ls.length:0;
return `<div class="grid stats">${[['Net P&L',money(net),net>=0?'positive':'negative'],['Trade Win%',t.length?(ws.length/t.length*100).toFixed(1)+'%':'—',''],['Daily Win%',dayVals.length?(winDays/dayVals.length*100).toFixed(1)+'%':'—',''],['Avg R:R',avgR?avgR.toFixed(2)+'R':'—',''],['Profit Factor',pf===Infinity?'∞':pf?pf.toFixed(2):'—','']].map(x=>`<div class="card"><div class="stat-label">${x[0]}</div><div class="stat-value ${x[2]}">${x[1]}</div></div>`).join('')}</div>
<div class="grid stats" style="margin-top:12px">${[['Total Trades',t.length],['Avg Win',money(avgW)],['Avg Loss',money(avgL)],['Best Trade',money(best)],['Current Streak',streak]].map(x=>`<div class="card"><div class="stat-label">${x[0]}</div><div class="stat-value">${x[1]}</div></div>`).join('')}</div>
<div class="section-head"><h2>Equity Curve</h2><span class="muted">Cumulative net P&amp;L</span></div><div class="card chart-wrap"><canvas id="equity"></canvas></div>
<div class="section-head"><h2>Monthly P&amp;L Calendar</h2><div class="month-nav"><button onclick="changeMonth(-1)">‹</button><b id="monthLabel"></b><button onclick="changeMonth(1)">›</button></div></div><div class="card"><div class="calendar" id="calendar"></div></div>
<div class="grid two" style="margin-top:14px"><div class="card"><div class="section-head" style="margin-top:0"><h2>Trade Breakdown</h2></div><div style="display:flex;align-items:center;gap:20px"><div style="width:150px;height:150px"><canvas id="pie" style="width:150px;height:150px"></canvas></div><div class="list"><span><i class="tag win">Win</i> ${ws.length}</span><span><i class="tag loss">Loss</i> ${ls.length}</span><span><i class="tag">BE</i> ${bes.length}</span></div></div></div><div class="card"><div class="section-head" style="margin-top:0"><h2>Account Summary</h2></div><div class="list"><div class="split"><span class="muted">Account</span><b>${esc(db.account)}</b></div><div class="split"><span class="muted">Gross profit</span><b class="positive">${money(grossWin)}</b></div><div class="split"><span class="muted">Gross loss</span><b class="negative">${money(-grossLoss)}</b></div><div class="split"><span class="muted">Win / Loss / BE</span><b>${ws.length} / ${ls.length} / ${bes.length}</b></div><div class="split"><span class="muted">Trading days</span><b>${dayVals.length}</b></div></div></div></div>
<div class="section-head"><h2>Model Performance</h2></div><div class="card table-wrap"><table><thead><tr><th>Model</th><th>Trades</th><th>Win %</th><th>Net P&amp;L</th><th>Avg P&amp;L</th></tr></thead><tbody>${db.models.map(m=>{let a=t.filter(x=>x.model===m),w=a.filter(x=>x.result==='Win').length;return `<tr><td>${esc(m)}</td><td>${a.length}</td><td>${a.length?(w/a.length*100).toFixed(1)+'%':'—'}</td><td class="${sum(a)>=0?'positive':'negative'}">${money(sum(a))}</td><td>${a.length?money(sum(a)/a.length):'—'}</td></tr>`}).join('')||'<tr><td colspan="5">No models configured.</td></tr>'}</tbody></table></div>`}
window.changeMonth=n=>{calDate.setMonth(calDate.getMonth()+n);render()};
function calendar(){const y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),daily={};db.trades.forEach(t=>daily[t.date]=(daily[t.date]||0)+(Number(t.pnl)||0));let html=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dayname">${x}</div>`).join('');for(let i=0;i<first;i++)html+='<div></div>';for(let d=1;d<=days;d++){let k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,v=daily[k];html+=`<div class="calday ${v>0?'win':v<0?'loss':''}"><b>${d}</b><small>${v===undefined?'':money(v)}</small></div>`}document.getElementById('calendar').innerHTML=html;document.getElementById('monthLabel').textContent=new Date(y,m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}
function renderDashboard(){document.getElementById('view').innerHTML=dashboard();chartLine('equity',(()=>{let a=0;return db.trades.slice().sort((x,y)=>(x.date+x.entryTime).localeCompare(y.date+y.entryTime)).map(t=>a+=Number(t.pnl)||0)})());chartPie('pie',db.trades.filter(x=>x.result==='Win').length,db.trades.filter(x=>x.result==='Loss').length,db.trades.filter(x=>x.result==='BE').length);calendar()}
function renderPlans(){document.getElementById('view').innerHTML=`<div class="section-head"><h2>Pre-market plans</h2>${headerAction('New Plan','newPlan()')}</div><div class="list">${db.plans.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<details class="item"><summary class="item-head"><div><span class="item-title">${esc(p.date)} · ${esc(p.bias)}</span><div class="item-meta">${esc((p.targets||'').slice(0,100))}</div></div><div class="actions"><button class="btn small" onclick="event.preventDefault();editPlan('${p.id}')">Edit</button><button class="btn small danger" onclick="event.preventDefault();del('plans','${p.id}')">Delete</button></div></summary><div class="item-body"><b>Economic events</b>\n${esc(p.events)}\n\n<b>Targets</b>\n${esc(p.targets)}\n\n<b>Game plan</b>\n${esc(p.game)}\n\n<b>Additional notes</b>\n${esc(p.notes)}<div class="grid two">${imageHtml(p.dailyImage)}${imageHtml(p.intradayImage)}</div></div></details>`).join('')||empty('No pre-market plans yet.')}</div>`}
function planForm(p={}){openDrawer(p.id?'Edit Pre-Market Plan':'New Pre-Market Plan',false,`<div class="form-grid">${field('Date','pDate',p.date||dateNow(),'date')}${selectField('Bias','pBias',['Bullish','Bearish','Neutral'],p.bias||'Neutral')}${area('Economic Calendar Events','pEvents',p.events)}${area('Targets','pTargets',p.targets)}${area('Game Plan','pGame',p.game)}${area('Additional Notes','pNotes',p.notes)}${fileField('Daily Chart Screenshot','pDaily')}${fileField('Intraday Chart Screenshot','pIntra')}</div>`,()=>{readImage('pDaily',p.dailyImage,a=>readImage('pIntra',p.intradayImage,b=>{let o={id:p.id||id(),date:val('pDate'),bias:val('pBias'),events:val('pEvents'),targets:val('pTargets'),game:val('pGame'),notes:val('pNotes'),dailyImage:a,intradayImage:b};upsert('plans',o)}));return true})}
window.newPlan=()=>planForm();window.editPlan=id=>planForm(db.plans.find(x=>x.id===id));window.del=(k,id)=>{if(confirm('Delete this entry?')){db[k]=db[k].filter(x=>x.id!==id);persist();render()}};
function upsert(k,o){let i=db[k].findIndex(x=>x.id===o.id);if(i<0)db[k].push(o);else db[k][i]=o;persist();render()}
function renderTrades(){document.getElementById('view').innerHTML=`<div class="section-head"><h2>All trades</h2>${headerAction('Log Trade','tradeForm()')}</div><div class="card table-wrap"><table><thead><tr><th>Date</th><th>Instrument</th><th>P&amp;L</th><th>Result</th><th>Model</th><th>Protocol</th><th>Rating</th><th></th></tr></thead><tbody>${db.trades.slice().sort((a,b)=>(b.date+b.entryTime).localeCompare(a.date+a.entryTime)).map(t=>`<tr><td>${esc(t.date)}</td><td><b>${esc(t.instrument)}</b></td><td class="${Number(t.pnl)>=0?'positive':'negative'}">${money(t.pnl)}</td><td><span class="tag ${t.result.toLowerCase()}">${t.result}</span></td><td>${esc(t.model)}</td><td>${esc(t.protocol)}</td><td>${t.rating||'—'}/10</td><td class="actions"><button class="btn small" onclick="tradeDetails('${t.id}')">Details</button><button class="btn small" onclick="tradeForm('${t.id}')">Edit</button><button class="btn small danger" onclick="del('trades','${t.id}')">×</button></td></tr>`).join('')||'<tr><td colspan="8">No trades logged yet.</td></tr>'}</tbody></table></div>`}
function tradeDetails(id){let t=db.trades.find(x=>x.id===id);openDrawer('Trade details',true,`<div class="grid two"><div><div class="muted">Date / instrument</div><b>${esc(t.date)} · ${esc(t.instrument)}</b></div><div><div class="muted">Net P&L / result</div><b class="${Number(t.pnl)>=0?'positive':'negative'}">${money(t.pnl)} · ${t.result}</b></div></div><div class="item-body"><b>Entry / Exit</b> ${esc(t.entry)} / ${esc(t.exit)} · ${esc(t.entryTime)}–${esc(t.exitTime)}\n<b>Contracts</b> ${esc(t.contracts)} · <b>Commission</b> ${money(t.commission)}\n<b>Model / protocol</b> ${esc(t.model)} / ${esc(t.protocol)}\n<b>Performance rating</b> ${esc(t.rating)}/10\n<b>Risk management</b>\n${esc((t.riskChecks||[]).join('\\n'))}\n<b>Trade checklist</b>\n${esc((t.tradeChecks||[]).join('\\n'))}\n<b>Confluences</b>\n${esc(t.confluences)}\n<b>Trade management</b>\n${esc(t.management)}\n<b>Trade notes</b>\n${esc(t.notes)}\n<b>Linked plan</b> ${esc(t.plan||'—')}${imageHtml(t.image)}</div>`,()=>true);document.getElementById('saveDrawer').classList.add('hidden');document.getElementById('cancelDrawer').textContent='Close'}
function tradeForm(id0){let t=db.trades.find(x=>x.id===id0)||{},plans=db.plans.map(x=>x.date+' · '+x.bias);openDrawer(id0?'Edit Trade':'Log Trade',true,`<div class="form-grid">
${field('Date','tDate',t.date||dateNow(),'date')}${field('Entry Time','tEntryTime',t.entryTime||'09:30','time')}${field('Exit Time','tExitTime',t.exitTime||'10:00','time')}
${selectField('Instrument','tInstrument',['MNQ','MES','MYM','MGC','NQ','ES','YM','GC'],t.instrument||'MNQ')}${selectField('Model','tModel',db.models,t.model||db.models[0]||'')}${selectField('Protocol','tProtocol',['LRLRC','HRLRC'],t.protocol||'LRLRC')}
${field('Entry Price','tEntry',t.entry,'number',false,'step="any"')}${field('Exit Price','tExit',t.exit,'number',false,'step="any"')}${field('Contracts','tContracts',t.contracts||1,'number',false,'min="1" step="1"')}${field('Net P&L ($)','tPnl',t.pnl,'number',false,'step="any"')}${field('Commission ($)','tCommission',t.commission||0,'number',false,'step="any"')}${selectField('Result','tResult',['Win','Loss','BE'],t.result||'Win')}${selectField('Link Pre-Market Plan','tPlan',['None',...plans],t.plan||'None')}${field('Performance Rating (1–10)','tRating',t.rating||'','number',false,'min="1" max="10"')}
<div class="field full"><div class="subhead">Risk Management Checklist</div><details><summary class="muted">Expand checklist</summary>${checkedList('riskChecks',db.risk,t.riskChecks||[])}</details></div>
<div class="field full"><div class="subhead">Trade Checklist</div><details><summary class="muted">Expand checklist</summary>${checkedList('tradeChecks',db.check,t.tradeChecks||[])}</details></div>
${area('Confluences','tConfluences',t.confluences)}${area('Trade Management','tManagement',t.management)}${area('Trade Notes','tNotes',t.notes)}${fileField('Execution Screenshot','tImage')}${imageHtml(t.image)}
</div>`,()=>{readImage('tImage',t.image,img=>upsert('trades',{id:t.id||id(),date:val('tDate'),entryTime:val('tEntryTime'),exitTime:val('tExitTime'),instrument:val('tInstrument'),model:val('tModel'),protocol:val('tProtocol'),entry:val('tEntry'),exit:val('tExit'),contracts:val('tContracts'),pnl:Number(val('tPnl')||0),commission:Number(val('tCommission')||0),result:val('tResult'),plan:val('tPlan')==='None'?'':val('tPlan'),rating:val('tRating'),riskChecks:selectedChecks('riskChecks'),tradeChecks:selectedChecks('tradeChecks'),confluences:val('tConfluences'),management:val('tManagement'),notes:val('tNotes'),image:img}));return true})}
window.tradeForm=tradeForm;window.tradeDetails=tradeDetails;
function renderReflections(){const periods=['Daily','Weekly','Monthly','Quarterly'];document.getElementById('view').innerHTML=`<div class="section-head"><h2>Reflections</h2>${headerAction('New Reflection','reflectionForm()')}</div><div class="grid four" style="grid-template-columns:repeat(4,1fr)">${periods.map(p=>`<div class="card"><div class="stat-label">${p}</div><div class="stat-value">${db.reflections.filter(x=>x.period===p).length}</div><div class="muted">Entries</div></div>`).join('')}</div><div class="filters">${['All',...periods].map(x=>`<button class="filter ${filters.reflection===x?'active':''}" onclick="setFilter('reflection','${x}')">${x}</button>`).join('')}</div><div class="list">${db.reflections.filter(x=>filters.reflection==='All'||x.period===filters.reflection).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="item"><div class="item-head"><div><b>${esc(x.title)}</b><div class="item-meta">${esc(x.period)} · ${esc(x.date)} · Rating ${esc(x.rating)}/10</div></div><div class="actions"><button class="btn small" onclick="reflectionForm('${x.id}')">Edit</button><button class="btn small danger" onclick="del('reflections','${x.id}')">Delete</button></div></div><div class="item-body">${esc(x.reflection)}\n<b>What went well:</b> ${esc(x.well)}\n<b>Lessons learned:</b> ${esc(x.lessons)}\n<b>Areas to improve:</b> ${esc(x.improve)}</div></div>`).join('')||empty('No reflections for this filter.')}</div>`}
function reflectionForm(id0){let x=db.reflections.find(a=>a.id===id0)||{};openDrawer(id0?'Edit Reflection':'New Reflection',false,`<div class="form-grid">${selectField('Period','rPeriod',['Daily','Weekly','Monthly','Quarterly'],x.period||'Daily')}${field('Date','rDate',x.date||dateNow(),'date')}${field('Rating (1–10)','rRating',x.rating||'','number')}${field('Title','rTitle',x.title)}${area('Reflection','rReflection',x.reflection)}${area('What Went Well','rWell',x.well)}${area('Lessons Learned','rLessons',x.lessons)}${area('Areas for Improvement','rImprove',x.improve)}</div>`,()=>{upsert('reflections',{id:x.id||id(),period:val('rPeriod'),date:val('rDate'),rating:val('rRating'),title:val('rTitle'),reflection:val('rReflection'),well:val('rWell'),lessons:val('rLessons'),improve:val('rImprove')});return true})}
function renderStudy(){let cats=['All','Daily','Weekly','Monthly','Asia','London','NYAM','NY Lunch','NYPM'];document.getElementById('view').innerHTML=`<div class="section-head"><h2>Study Library</h2>${headerAction('New Study Entry','studyForm()')}</div><div class="filters">${cats.map(x=>`<button class="filter ${filters.study===x?'active':''}" onclick="setFilter('study','${x}')">${x}</button>`).join('')}</div><div class="list">${db.study.filter(x=>filters.study==='All'||x.type===filters.study).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="item"><div class="item-head"><div><b>${esc(x.title)}</b><div class="item-meta">${esc(x.date)} · ${esc(x.type)}</div></div><div class="actions"><button class="btn small" onclick="studyForm('${x.id}')">Edit</button><button class="btn small danger" onclick="del('study','${x.id}')">Delete</button></div></div><div class="item-body">${esc(x.description)}${imageHtml(x.image)}</div></div>`).join('')||empty('No study entries for this filter.')}</div>`}
function studyForm(id0){let x=db.study.find(a=>a.id===id0)||{};openDrawer(id0?'Edit Study Entry':'New Study Entry',true,`<div class="form-grid">${field('Date','sDate',x.date||dateNow(),'date')}${selectField('Session / Type','sType',['Daily','Weekly','Monthly','Asia','London','NYAM','NY Lunch','NYPM'],x.type||'Daily')}${field('Title','sTitle',x.title,'text',true)}${area('Description','sDescription',x.description)}${fileField('Chart Screenshot','sImage')}${imageHtml(x.image)}</div>`,()=>{readImage('sImage',x.image,img=>upsert('study',{id:x.id||id(),date:val('sDate'),type:val('sType'),title:val('sTitle'),description:val('sDescription'),image:img}));return true})}
window.setFilter=(k,v)=>{filters[k]=v;render()};
function renderGoals(){let periods=['Daily','Weekly','Monthly','Quarterly','Annual'];document.getElementById('view').innerHTML=`<div class="section-head"><h2>Goals</h2>${headerAction('New Goal','goalForm()')}</div><div class="filters">${periods.map(x=>`<button class="filter ${filters.goalPeriod===x?'active':''}" onclick="setFilter('goalPeriod','${x}')">${x}</button>`).join('')}<button class="filter ${filters.goalPeriod==='All'?'active':''}" onclick="setFilter('goalPeriod','All')">All periods</button><select class="inline-input" onchange="setFilter('goalStatus',this.value)"><option>Active</option><option ${filters.goalStatus==='Completed'?'selected':''}>Completed</option><option ${filters.goalStatus==='All'?'selected':''}>All</option></select></div><div class="list">${db.goals.filter(x=>(filters.goalPeriod==='All'||x.period===filters.goalPeriod)&&(filters.goalStatus==='All'||(filters.goalStatus==='Completed'?x.completed:!x.completed))).map(x=>`<div class="item"><div class="item-head"><div><b>${esc(x.title)}</b><div class="item-meta">${esc(x.period)} · Target ${esc(x.target||'—')}</div></div><div class="actions"><button class="btn small" onclick="toggleGoal('${x.id}')">${x.completed?'Reopen':'Mark complete'}</button><button class="btn small" onclick="goalForm('${x.id}')">Edit</button><button class="btn small danger" onclick="del('goals','${x.id}')">Delete</button></div></div><p class="muted">${esc(x.description)}</p><div class="split"><span class="muted">Progress</span><b>${goalProgress(x)}%</b></div><div class="progress"><i style="width:${goalProgress(x)}%"></i></div><div class="muted">Success metrics: ${esc(x.metrics)}</div><div class="checklist" style="margin-top:10px">${(x.items||[]).map((it,i)=>`<label class="checkline"><input type="checkbox" ${it.done?'checked':''} onchange="goalItem('${x.id}',${i},this.checked)"> ${esc(it.text)}</label>`).join('')}</div></div>`).join('')||empty('No goals match these filters.')}</div>`}
function goalProgress(x){let a=x.items||[];return a.length?Math.round(a.filter(i=>i.done).length/a.length*100):(x.completed?100:0)}
window.toggleGoal=id0=>{let x=db.goals.find(a=>a.id===id0);x.completed=!x.completed;persist();render()};window.goalItem=(id0,i,v)=>{let x=db.goals.find(a=>a.id===id0);x.items[i].done=v;persist();render()};
function goalForm(id0){let x=db.goals.find(a=>a.id===id0)||{},items=(x.items||[]).map(i=>i.text).join('\\n');openDrawer(id0?'Edit Goal':'New Goal',false,`<div class="form-grid">${field('Title','gTitle',x.title,'text',true)}${selectField('Period','gPeriod',['Daily','Weekly','Monthly','Quarterly','Annual'],x.period||'Weekly')}${field('Target Date','gTarget',x.target||'','date')}${area('Description','gDescription',x.description)}${area('Success Metrics','gMetrics',x.metrics)}${area('Sub-checklist items (one per line)','gItems',items)}</div>`,()=>{let old=x.items||[],lines=val('gItems').split('\\n').map(a=>a.trim()).filter(Boolean);upsert('goals',{id:x.id||id(),title:val('gTitle'),period:val('gPeriod'),target:val('gTarget'),description:val('gDescription'),metrics:val('gMetrics'),items:lines.map(s=>({text:s,done:old.find(o=>o.text===s)?.done||false})),completed:x.completed||false});return true})}
window.copyShareLink=async()=>{if(!cloudReady||!shareToken){alert('Connect Supabase first.');return}const url=location.origin+location.pathname+'?share='+shareToken;try{await navigator.clipboard.writeText(url);alert('Public read-only link copied.')}catch(e){prompt('Copy this public read-only link:',url)}};
function renderSystem(){document.getElementById('view').innerHTML=`<div class="grid two"><div class="card"><div class="section-head" style="margin-top:0"><h2>Trading Models</h2><button class="btn small" onclick="addConfig('models')">+ Add</button></div><div class="list">${db.models.map((x,i)=>`<div class="split"><span>${esc(x)}</span><button class="btn small danger" onclick="removeConfig('models',${i})">Remove</button></div>`).join('')||'<span class="muted">No models.</span>'}</div></div><div class="card"><div class="section-head" style="margin-top:0"><h2>Risk Management Checklist</h2><button class="btn small" onclick="addConfig('risk')">+ Add</button></div><div class="list">${db.risk.map((x,i)=>`<div class="split"><span>${esc(x)}</span><button class="btn small danger" onclick="removeConfig('risk',${i})">Remove</button></div>`).join('')}</div></div><div class="card"><div class="section-head" style="margin-top:0"><h2>Trade Checklist</h2><button class="btn small" onclick="addConfig('check')">+ Add</button></div><div class="list">${db.check.map((x,i)=>`<div class="split"><span>${esc(x)}</span><button class="btn small danger" onclick="removeConfig('check',${i})">Remove</button></div>`).join('')}</div></div><div class="card"><h2 style="font-size:15px;margin-top:0">Local Storage &amp; Backup</h2><p class="notice">Your journal is saved in this browser on this device. Each visitor has their own separate journal. Export JSON backups regularly to protect your data. To move your journal to another browser or device, export a backup here and import it there.</p><div class="actions" style="flex-wrap:wrap"><button class="btn" onclick="exportData()">Export JSON Backup</button><button class="btn" onclick="document.getElementById('importFile').click()">Import JSON Backup</button><input id="importFile" type="file" accept=".json,application/json" class="hidden" onchange="importData(this)"></div><p class="notice" id="shareHelp">${''}</p></div></div>`}
window.addConfig=k=>{let x=prompt('Enter new '+(k==='models'?'model':'checklist criterion')+':');if(x?.trim()){db[k].push(x.trim());persist();render()}};window.removeConfig=(k,i)=>{if(confirm('Remove this item?')){db[k].splice(i,1);persist();render()}};
window.exportData=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tradelog-backup-'+dateNow()+'.json';a.click();URL.revokeObjectURL(a.href)};
window.importData=input=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.trades)||!Array.isArray(x.plans))throw Error('Invalid backup format');if(confirm('Import this backup and replace the current journal data?')){db={...structuredClone(defaults),...x};persist();document.getElementById('accountName').value=db.account||'Account name';render();alert('Backup imported.')}}catch(e){alert('Could not import backup: '+e.message)}input.value=''};r.readAsText(f)};
function render(){document.getElementById('pageTitle').textContent=tab;document.getElementById('accountName').value=db.account||'Account name';if(tab==='Dashboard')renderDashboard();else if(tab==='Pre-Market Plan')renderPlans();else if(tab==='Trading Journal')renderTrades();else if(tab==='Reflections')renderReflections();else if(tab==='Study')renderStudy();else if(tab==='Goals')renderGoals();else renderSystem()}
render();
</script>
</body></html>
